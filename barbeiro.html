<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel dos Barbeiros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; margin: 0; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #d2b378; font-size: 22px; margin-bottom: 20px; }
    
    .filter-card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
    .filter-group { margin-bottom: 12px; }
    .filter-group:last-child { margin-bottom: 0; }
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; font-weight: bold; }
    select, input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 15px; }
    
    .card { background: #1e1e1e; border-left: 5px solid #d2b378; border-radius: 6px; padding: 15px; margin-bottom: 12px; }
    .card.concluido { border-left-color: #22c55e; opacity: 0.7; }
    .card.cancelado { border-left-color: #ef4444; opacity: 0.4; }
    
    .card-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #d2b378; }
    .card-body p { margin: 4px 0; font-size: 13px; color: #ccc; }
    
    .actions { margin-top: 12px; display: flex; gap: 8px; }
    .btn { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; }
    .btn-success { background: #22c55e; color: #fff; }
    .btn-success:hover { background: #16a34a; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .empty-msg { text-align: center; color: #777; margin-top: 30px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <h1><i class="fa-solid fa-scissors"></i> Agenda do Barbeiro</h1>

    <div class="filter-card">
      <div class="filter-group">
        <label for="selectBarbeiro">SELECIONE O SEU NOME:</label>
        <select id="selectBarbeiro" onchange="carregarAgendamentos()">
          <option value="Lerinho Costa">Lerinho Costa</option>
          <option value="Luan Cezar">Luan Cezar</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="selectData">DATA:</label>
        <input type="date" id="selectData" onchange="carregarAgendamentos()">
      </div>
    </div>

    <!-- Lista dos cortes agendados -->
    <div id="lista-agendamentos"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyBLgnDDImGXkKjTd7Z5FWm2yIkDTF5hJWU",
        authDomain: "barbearia-lerinho-costa-5e12f.firebaseapp.com",
        projectId: "barbearia-lerinho-costa-5e12f",
        storageBucket: "barbearia-lerinho-costa-5e12f.firebasestorage.app",
        messagingSenderId: "833448961588",
        appId: "1:833448961588:web:126db05be2e01890168c61"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    } 

    window.db = firebase.firestore();
    var db = firebase.firestore();

    let unsubscribe = null;

    // Define a data local atual sem bug de fuso horário
    const inputData = document.getElementById("selectData");
    if (inputData) {
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const dia = String(hoje.getDate()).padStart(2, '0');
        inputData.value = `${ano}-${mes}-${dia}`;
    }

    function carregarAgendamentos() {
        const barbeiroEl = document.getElementById("selectBarbeiro");
        const dataInputEl = document.getElementById("selectData");
        const container = document.getElementById("lista-agendamentos");

        if (!barbeiroEl || !dataInputEl || !container) return;

        const barbeiro = barbeiroEl.value;
        const dataInput = dataInputEl.value; // Ex: "2026-10-05"

        if (!dataInput) return;

        const [ano, mes, dia] = dataInput.split("-");
        const dataDDMM = `${dia}/${mes}`;
        const dataDDMMYYYY = `${dia}/${mes}/${ano}`;

        container.innerHTML = "<p class='empty-msg'>Buscando agendamentos...</p>";

        // Cancela ouvinte anterior para evitar requisições acumuladas
        if (unsubscribe) unsubscribe();

        // Busca aceitando formatos variados de data (DD/MM, DD/MM/YYYY ou YYYY-MM-DD)
        unsubscribe = db.collection("agendamentos")
            .where("profissional", "==", barbeiro)
            .where("data", "in", [dataDDMM, dataDDMMYYYY, dataInput])
            .onSnapshot((snapshot) => {
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = `<div class="empty-msg">Nenhum agendamento para ${barbeiro} em ${dataDDMM}.</div>`;
                    return;
                }

                const idsProcessados = new Set();

                snapshot.forEach((doc) => {
                    // Impede duplicados no render
                    if (idsProcessados.has(doc.id)) return;
                    idsProcessados.add(doc.id);

                    const ag = doc.data();
                    const idDoc = doc.id;
                    const status = ag.status || "Pendente";
                    const servicos = Array.isArray(ag.servicos) ? ag.servicos.join(", ") : (ag.servicos || "Não informado");
                    const clienteNome = ag.usuario || ag.cliente || ag.nome || ag.email || "Cliente";

                    // Tratamento de telefone e WhatsApp
                    const telOriginal = ag.telefone || ag.contato || "Não informado";
                    const telApenasNumeros = telOriginal.replace(/\D/g, "");
                    const linkWhatsapp = telApenasNumeros 
                        ? `https://wa.me/55${telApenasNumeros}?text=Olá,%20${encodeURIComponent(clienteNome)}!%20Falo%20da%20Barbearia%20Lerinho%20Costa%20sobre%20o%20seu%20agendamento.` 
                        : "#";

                    let cardClass = "card";
                    if (status === "Concluído") cardClass += " concluido";
                    if (status === "Cancelado") cardClass += " cancelado";

                    const totalFormatado = ag.total ? Number(ag.total).toFixed(2).replace('.', ',') : '0,00';

                    container.innerHTML += `
                        <div class="${cardClass}">
                            <div class="card-header">
                                <span><i class="fa-regular fa-clock"></i> ${ag.horario || 'Horário N/A'}</span>
                                <span>R$ ${totalFormatado}</span>
                            </div>
                            <div class="card-body">
                                <p><strong>Cliente:</strong> ${clienteNome}</p>
                                <p><strong>Contato:</strong> ${telOriginal} ${telApenasNumeros ? `<a href="${linkWhatsapp}" target="_blank" style="color: #25D366; font-weight: bold; margin-left: 8px; text-decoration: none;"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>` : ''}</p>
                                <p><strong>Serviços:</strong> ${servicos}</p>
                                <p><strong>Status:</strong> <strong>${status}</strong></p>
                            </div>
                            <div class="actions">
                                ${status !== "Concluído" ? `<button class="btn btn-success" onclick="alterarStatus('${idDoc}', 'Concluído')">Concluir</button>` : ''}
                                ${status !== "Cancelado" ? `<button class="btn btn-danger" onclick="alterarStatus('${idDoc}', 'Cancelado')">Cancelar</button>` : ''}
                            </div>
                        </div>
                    `;
                });
            }, (error) => {
                console.error("Erro ao buscar agendamentos: ", error);
                container.innerHTML = "<p class='empty-msg' style='color:#ef4444;'>Erro ao carregar do Firebase.</p>";
            });
    }

    function alterarStatus(idDoc, novoStatus) {
        db.collection("agendamentos").doc(idDoc).update({
            status: novoStatus
        }).then(() => {
            console.log(`Status do agendamento ${idDoc} atualizado para: ${novoStatus}`);
        }).catch(err => alert("Erro ao atualizar status: " + err.message));
    }

    // Inicializa assim que a página carrega
    document.addEventListener("DOMContentLoaded", function() {
        carregarAgendamentos();
    });
  </script>
</body>
</html>
